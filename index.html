<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
  <link rel="stylesheet" href="form.css">
</head>
<body>
  <div class="container">
    <h1>Registration Form</h1>

    <form id="regForm" novalidate>
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Enter your full name">
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="text" id="email" placeholder="Enter your email">
      </div>

      <div class="field">
        <label for="mobile">Mobile Number</label>
        <input type="text" id="mobile" placeholder="10-digit mobile number">
      </div>

      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Choose a username">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter a strong password">
        <small>Min 8 characters with uppercase, lowercase, digit and special character.</small>
      </div>

      <div class="buttons">
        <button type="submit">Submit</button>
        <button type="reset" class="secondary">Reset</button>
      </div>
    </form>
  </div>

  <script src="form.js"></script>
</body>
</html>
